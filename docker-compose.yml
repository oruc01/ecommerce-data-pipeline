version: '3.8'

services:
  # Layihəmizin verilənlər bazası (Database Layer)
  postgres_db:
    image: postgres:15
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: oruc_user
      POSTGRES_PASSWORD: my_secret_password
      POSTGRES_DB: ecommerce_warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
